<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DERENTAS - Unir fotos en PDF</title>
  <style>
    :root {
      --yellow: #ffd400;
      --bg: #0b0b0b;
      --panel: #171717;
      --muted: #a6a6a6;
      --border: #383838;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 16px;
      background: var(--bg);
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }
    .container { width: 100%; max-width: 900px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 30px; }
    .logo {
      display: inline-flex; align-items: center; justify-content: center;
      width: 58px; height: 58px; border: 2px solid var(--yellow);
      border-radius: 14px; color: var(--yellow); font-weight: 900;
      font-size: 22px; letter-spacing: -2px; margin-bottom: 12px;
    }
    h1 { margin: 0; color: var(--yellow); font-size: clamp(24px, 5vw, 34px); }
    header p { color: var(--muted); margin: 9px 0 0; }
    .panel {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 18px; padding: 24px;
    }
    .uploads {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    .upload-card {
      min-width: 0; border: 1px dashed #555; border-radius: 14px;
      padding: 18px; background: #101010;
    }
    .upload-card h2 { margin: 0 0 14px; font-size: 17px; }
    .drop-area {
      min-height: 220px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      text-align: center; border-radius: 10px; background: #1b1b1b;
      padding: 14px; overflow: hidden;
    }
    .drop-area img {
      display: none; max-width: 100%; max-height: 190px;
      object-fit: contain; border-radius: 7px;
    }
    .placeholder { color: var(--muted); font-size: 14px; }
    .file-input { display: none; }
    .choose {
      display: inline-block; cursor: pointer; border: 1px solid var(--yellow);
      color: var(--yellow); padding: 10px 14px; border-radius: 8px;
      font-weight: 700; font-size: 13px;
    }
    .file-name {
      color: var(--muted); font-size: 12px; margin: 10px 0 0;
      overflow-wrap: anywhere; min-height: 14px;
    }
    .actions { display: flex; justify-content: center; margin-top: 24px; }
    button {
      border: 0; border-radius: 10px; padding: 15px 28px;
      background: var(--yellow); color: #111; font-size: 15px;
      font-weight: 900; cursor: pointer; transition: transform .15s, opacity .15s;
    }
    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: .4; cursor: not-allowed; transform: none; }
    .hint { text-align: center; color: var(--muted); font-size: 12px; margin: 16px 0 0; }
    .status { min-height: 20px; text-align: center; margin-top: 14px; font-size: 14px; }
    @media (max-width: 650px) {
      .uploads { grid-template-columns: 1fr; }
      .panel { padding: 16px; }
      .drop-area { min-height: 190px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <div class="logo">DR</div>
      <h1>UNIR FOTOS EN PDF</h1>
      <p>Cargá dos fotos y descargalas juntas en un solo documento.</p>
    </header>

    <section class="panel">
      <div class="uploads">
        <article class="upload-card">
          <h2>FOTO 1</h2>
          <div class="drop-area">
            <div class="placeholder" id="placeholder1">Todavía no cargaste una foto</div>
            <img id="preview1" alt="Vista previa de la foto 1">
            <label class="choose" for="photo1">SELECCIONAR FOTO</label>
            <input class="file-input" id="photo1" type="file" accept="image/*">
          </div>
          <p class="file-name" id="name1"></p>
        </article>

        <article class="upload-card">
          <h2>FOTO 2</h2>
          <div class="drop-area">
            <div class="placeholder" id="placeholder2">Todavía no cargaste una foto</div>
            <img id="preview2" alt="Vista previa de la foto 2">
            <label class="choose" for="photo2">SELECCIONAR FOTO</label>
            <input class="file-input" id="photo2" type="file" accept="image/*">
          </div>
          <p class="file-name" id="name2"></p>
        </article>
      </div>

      <div class="actions">
        <button id="makePdf" disabled>GENERAR PDF</button>
      </div>
      <p class="hint">Cada foto se coloca en una página del PDF, ajustada para que se vea completa.</p>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    const files = [null, null];
    const previews = [
      { img: document.getElementById('preview1'), placeholder: document.getElementById('placeholder1'), name: document.getElementById('name1') },
      { img: document.getElementById('preview2'), placeholder: document.getElementById('placeholder2'), name: document.getElementById('name2') }
    ];

    [1, 2].forEach((number) => {
      document.getElementById(`photo${number}`).addEventListener('change', (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;

        if (!file.type.startsWith('image/')) {
          document.getElementById('status').textContent = 'Elegí un archivo de imagen válido.';
          event.target.value = '';
          return;
        }

        files[number - 1] = file;
        const reader = new FileReader();
        reader.onload = () => {
          previews[number - 1].img.src = reader.result;
          previews[number - 1].img.style.display = 'block';
          previews[number - 1].placeholder.style.display = 'none';
          previews[number - 1].name.textContent = file.name;
          updateButton();
        };
        reader.readAsDataURL(file);
      });
    });

    function updateButton() {
      document.getElementById('makePdf').disabled = !files[0] || !files[1];
      document.getElementById('status').textContent = '';
    }

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          resolve(img);
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error('No se pudo leer una de las imágenes.'));
        };
        img.src = url;
      });
    }

    document.getElementById('makePdf').addEventListener('click', async () => {
      const button = document.getElementById('makePdf');
      const status = document.getElementById('status');
      button.disabled = true;
      status.textContent = 'Preparando el PDF...';

      try {
        if (!window.jspdf || !window.jspdf.jsPDF) {
          throw new Error('No se pudo cargar el generador de PDF. Revisá tu conexión a internet e intentá de nuevo.');
        }

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });
        const pageWidth = pdf.internal.pageSize.getWidth();
        const pageHeight = pdf.internal.pageSize.getHeight();
        const margin = 10;

        for (let i = 0; i < files.length; i++) {
          const img = await loadImage(files[i]);
          if (i > 0) pdf.addPage();

          const canvas = document.createElement('canvas');
          const maxSide = 2400;
          const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
          canvas.width = Math.round(img.naturalWidth * scale);
          canvas.height = Math.round(img.naturalHeight * scale);
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          const imageData = canvas.toDataURL('image/jpeg', 0.92);
          const ratio = Math.min(
            (pageWidth - margin * 2) / canvas.width,
            (pageHeight - margin * 2) / canvas.height
          );
          const width = canvas.width * ratio;
          const height = canvas.height * ratio;
          const x = (pageWidth - width) / 2;
          const y = (pageHeight - height) / 2;
          pdf.addImage(imageData, 'JPEG', x, y, width, height);
        }

        pdf.save('fotos-unidas.pdf');
        status.textContent = '¡Listo! Se descargó el archivo fotos-unidas.pdf.';
      } catch (error) {
        status.textContent = error.message || 'Ocurrió un error al generar el PDF.';
      } finally {
        button.disabled = !files[0] || !files[1];
      }
    });
  </script>
</body>
</html>
